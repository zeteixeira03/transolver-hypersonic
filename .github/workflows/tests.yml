name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libs for headless gmsh
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      - name: Install CPU torch first (avoid CUDA wheels)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with cfd + dev extras
        run: pip install -e ".[cfd,dev]"
      - name: Run test suite
        run: pytest tests/ -q
