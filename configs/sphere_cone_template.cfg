% =================================================================================
% SU2 axisymmetric laminar Navier-Stokes template for sphere-cone hypersonic cases
%
% Placeholders (substituted by src/cfd/runner.py):
%   __MACH__       freestream Mach number
%   __T_INF__      freestream static temperature [K]
%   __P_INF__      freestream static pressure   [Pa]
%   __T_W__        isothermal wall temperature  [K]
%   __ITER__       max outer iterations (safety ceiling; convergence is residual-driven)
%   __CFL_MAX__    maximum CFL after ramping
%   __MGLEVEL__    geometric multigrid levels (0 = off; 2 worth a benchmark on hypersonic)
%   __CONV_MINVAL__ RMS_DENSITY residual target to stop at
%   __MESH__       SU2 mesh filename (relative to run directory)
%   __VOLUME__     volume-output base name
%   __SURFACE__    surface-output base name
%   __RESTART__    restart base name
% =================================================================================

% ---- problem definition ----
SOLVER= NAVIER_STOKES
KIND_TURB_MODEL= NONE
MATH_PROBLEM= DIRECT
RESTART_SOL= __RESTART_SOL__
SYSTEM_MEASUREMENTS= SI
AXISYMMETRIC= YES

% ---- freestream ----
MACH_NUMBER= __MACH__
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_TEMPERATURE= __T_INF__
FREESTREAM_PRESSURE= __P_INF__
FREESTREAM_OPTION= TEMPERATURE_FS
INIT_OPTION= TD_CONDITIONS
REF_DIMENSIONALIZATION= DIMENSIONAL

% ---- fluid model: ideal gas, calorically perfect air ----
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058

% ---- viscosity & conductivity ----
VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716E-05
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.71

% ---- boundary conditions ----
MARKER_ISOTHERMAL= ( WALL, __T_W__ )
MARKER_SYM= ( SYMMETRY )
MARKER_FAR= ( FARFIELD, OUTLET )

% ---- post-processing markers ----
MARKER_PLOTTING= ( WALL )
MARKER_MONITORING= ( WALL )

% ---- numerics: convective (ROE + Venkat is the stable hypersonic combo) ----
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= __MUSCL__
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.03
ENTROPY_FIX_COEFF= 0.10
ROE_LOW_DISSIPATION= NONE

% ---- numerics: viscous ----
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES

% ---- time integration ----
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 0.5
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.4, 0.1, __CFL_MAX__ )

% ---- multigrid (geometric agglomeration; 0 disables) ----
MGLEVEL= __MGLEVEL__
MGCYCLE= V_CYCLE
MG_PRE_SMOOTH= ( 1, 2, 3, 3 )
MG_POST_SMOOTH= ( 0, 0, 0, 0 )
MG_CORRECTION_SMOOTH= ( 0, 0, 0, 0 )
MG_DAMP_RESTRICTION= 0.75
MG_DAMP_PROLONGATION= 0.75

% ---- linear solver ----
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-5
LINEAR_SOLVER_ITER= 25

% ---- convergence (residual-driven; ITER is only a safety ceiling) ----
ITER= __ITER__
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= __CONV_MINVAL__
CONV_STARTITER= 50
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6

% ---- I/O ----
MESH_FILENAME= __MESH__
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW, SURFACE_CSV )
VOLUME_FILENAME= __VOLUME__
SURFACE_FILENAME= __SURFACE__
RESTART_FILENAME= __RESTART__
SOLUTION_FILENAME= solution_flow.dat
READ_BINARY_RESTART= YES
OUTPUT_WRT_FREQ= 2000
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_ENERGY, LIFT, DRAG )
SCREEN_WRT_FREQ_INNER= 50
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF, HEAT, FLOW_COEFF )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE, RESIDUAL )
